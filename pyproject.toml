[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mcp-annotation-lab"
version = "0.1.0"
description = "Local mock MCP tools and reproducible baseline validation for annotation research"
requires-python = ">=3.12,<3.13"
dependencies = ["mcp==2.1.1"]

[project.scripts]
annotation-lab = "mcp_annotation_lab.cli:main"

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_annotation_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
